name: Nova rebrand

on:
  push:
    branches:
      - feature/nova-foundation
    paths:
      - 'tools/nova/rebrand.py'
      - '.nova-rebrand-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/nova-foundation

      - name: Skip generated rebrand commit
        id: guard
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == *"[nova-rebrand]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mechanical rename
        if: steps.guard.outputs.skip != 'true'
        run: python3 tools/nova/rebrand.py

      - name: Commit rebrand
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rebrand changes required."
            exit 0
          fi
          git commit -m "refactor: complete Doriax to Nova mechanical rename [nova-rebrand]"
          git push origin HEAD:feature/nova-foundation
